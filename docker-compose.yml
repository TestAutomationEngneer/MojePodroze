# Moje podróże – uruchamianie lokalne.
#
#   docker compose up -d --build                     # backend :8000/docs, frontend: http://localhost:5173
#   docker compose run --rm backend-dev              # wszystkie testy (pytest) w kontenerze
#   docker compose run --rm backend-dev mutmut run   # testy mutacyjne (Linux w kontenerze)
#   docker compose --profile sonar up -d             # SonarQube: http://localhost:9000
#   docker compose run --rm sonar-scanner-backend    # analiza backendu (wymaga SONAR_TOKEN)
#
# Szczegóły: README.md. Frontend: serwer Vite (npm run dev), /api przekazuje do backendu (API_PROXY_TARGET).

name: moje-podroze

services:
  backend:
    build:
      context: ./backend
      target: runtime
    ports:
      - "8000:8000"
    environment:
      MP_CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      TZ: Europe/Warsaw
    volumes:
      - backend-data:/app/data # baza SQLite i zdjęcia przetrwają restart

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  backend-dev:
    profiles: ["dev"]
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/app # kod z dysku: raporty (coverage.xml, mutants/) trafiają do backend/
    command: ["pytest", "--cov", "--cov-report=xml", "--junitxml=test-results.xml"]

  sonarqube:
    profiles: ["sonar"]
    image: sonarqube:community
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs

  sonar-scanner-backend:
    profiles: ["sonar-scan"] # uruchamiany jednorazowo przez `docker compose run`
    image: sonarsource/sonar-scanner-cli:latest
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    volumes:
      - ./backend:/usr/src # skaner czyta backend/sonar-project.properties

volumes:
  backend-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
